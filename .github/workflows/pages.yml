# Publishes site/ to GitHub Pages at legal.takechat.app (README.md, "Publishing").
# Pull requests run the checks only; a push to main runs them with --publish, which refuses any
# TO-FILL marker, and then deploys. A failed check leaves the pages that are online unchanged.
name: Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the pages
        run: python3 scripts/check ${{ github.event_name == 'pull_request' && '' || '--publish' }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
